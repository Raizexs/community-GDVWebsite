# /etc/nginx/nginx.conf

user nginx;
worker_processes 1;

# Configuración global
events {}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Aquí van las configuraciones adicionales
    access_log  /var/log/nginx/access.log;
    error_log   /var/log/nginx/error.log;

    server {
        listen 80;
        server_name localhost;

        root /usr/share/nginx/html;
        index index.html;

        # Security headers (sin BFF; endurecen la SPA estática)
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; form-action 'self'; object-src 'none'; script-src 'self' 'unsafe-inline' https://challenges.cloudflare.com https://www.googletagmanager.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdn.jsdelivr.net; font-src 'self' data: https://fonts.gstatic.com https://cdn.jsdelivr.net; img-src 'self' data: blob: https://gateway.praxsuite.com https://api.praxsuite.com https://portal.praxsuite.com https://*.blob.core.windows.net https://www.google-analytics.com https://www.google.com; connect-src 'self' https://gateway.praxsuite.com https://api.praxsuite.com https://*.blob.core.windows.net https://challenges.cloudflare.com https://www.google-analytics.com https://analytics.google.com https://region1.google-analytics.com https://www.googletagmanager.com https://www.google.com; frame-src https://challenges.cloudflare.com; worker-src 'self' blob:;" always;

        # Redirecciones legacy Bitácora → Noticias
        location = /bitacora {
            return 301 /noticias;
        }
        location = /bitacora/ {
            return 301 /noticias;
        }
        location = /bitacora/feed.xml {
            return 301 /noticias/feed.xml;
        }
        location ~ ^/bitacora/(.+)$ {
            return 301 /noticias/$1;
        }

        # Redirigir todas las rutas a index.html para que React maneje el enrutamiento
        location / {
            try_files $uri $uri/ /index.html;
        }

        error_page 404 /index.html;
    }
}
